services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: clawbot
      POSTGRES_USER: clawbot
      POSTGRES_PASSWORD: clawbot
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://clawbot:clawbot@db:5432/clawbot?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 3001
    depends_on:
      - db
      - redis
    ports:
      - "3001:3001"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:3001
      BASIC_AUTH_USER: ${API_BASIC_AUTH_USER}
      BASIC_AUTH_PASSWORD: ${API_BASIC_AUTH_PASSWORD}
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pg_data:
